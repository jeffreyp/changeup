<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Changeup — Chord Change Metronome</title>
<style>
  :root {
    --bg: #12141c;
    --panel: #1c1f2b;
    --panel-2: #232738;
    --text: #f0f1f5;
    --muted: #9198ad;
    --accent: #5fd0a8;
    --accent-dim: #2f5c4c;
    --danger: #e0616b;
    --border: #2e3244;
    --countin: #7c9cff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 12px 20px;
  }
  h1 {
    font-size: 1.2rem;
    font-weight: 600;
    margin: 0 0 2px;
    letter-spacing: 0.02em;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.78rem;
    margin-bottom: 10px;
    text-align: center;
  }
  .container {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Chord display */
  .chord-stage {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .now-next-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }
  .chord-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .chord-label {
    font-size: 0.68rem;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .chord-arrow {
    color: var(--border);
    font-size: 1.8rem;
    align-self: center;
    margin-top: 10px;
  }
  .chord-display {
    font-size: 3.6rem;
    font-weight: 700;
    line-height: 1;
    min-height: 3.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    transition: transform 0.08s ease;
  }
  .chord-display.pulse {
    transform: scale(1.08);
  }
  .chord-display.idle {
    color: var(--muted);
    font-size: 1.6rem;
  }
  .chord-display.pending {
    opacity: 0.5;
  }
  .next-chord-display {
    font-size: 1.9rem;
    color: var(--muted);
    min-height: 3.9rem;
  }
  .beat-dots {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    min-height: 14px;
  }
  .beat-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    transition: background 0.05s ease, transform 0.05s ease;
  }
  .beat-dot.on {
    background: var(--accent);
    border-color: var(--accent);
    transform: scale(1.15);
  }
  .beat-dot.accent.on {
    background: #ffd166;
    border-color: #ffd166;
  }
  .beat-dot.countin.on {
    background: var(--countin);
    border-color: var(--countin);
  }
  .phase-label {
    color: var(--muted);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    min-height: 1em;
  }

  /* Controls */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .row label {
    font-size: 0.85rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .bpm-value {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--text);
    min-width: 3.5ch;
    text-align: right;
  }
  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    height: 4px;
  }
  input[type="number"] {
    width: 64px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 0.95rem;
  }
  .bpm-buttons {
    display: flex;
    gap: 6px;
  }
  .bpm-buttons button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    font-size: 1rem;
    cursor: pointer;
  }
  .bpm-buttons button:active { background: var(--accent-dim); }

  .chords-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .chord-toggle {
    position: relative;
  }
  .chord-toggle input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
  }
  .chord-toggle span {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 0;
    border-radius: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-weight: 600;
    font-size: 0.95rem;
    user-select: none;
    transition: background 0.1s ease, color 0.1s ease, border-color 0.1s ease;
  }
  .chord-toggle input:checked + span {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  .order-toggle {
    display: flex;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .order-toggle button {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 6px 0;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .order-toggle button.active {
    background: var(--accent-dim);
    color: var(--accent);
    font-weight: 600;
  }

  #modeToggle button {
    font-size: 0.76rem;
    padding: 8px 2px;
  }

  .chord-select-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .link-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.78rem;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }

  #startBtn {
    background: var(--accent);
    color: #0b1712;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  #startBtn.running {
    background: var(--danger);
    color: #2a0e10;
  }
  #startBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .warning {
    color: var(--danger);
    font-size: 0.8rem;
    text-align: center;
    min-height: 1em;
  }

  .hint {
    color: var(--muted);
    font-size: 0.75rem;
    text-align: center;
  }

  .mode-hidden {
    display: none !important;
  }

  @media (max-width: 380px) {
    .chord-display { font-size: 3.6rem; }
    .chords-grid { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>

  <h1>Changeup</h1>
  <div class="subtitle">Metronome + chord-change trainer</div>

  <div class="container">

    <div class="chord-stage">
      <div class="now-next-row" id="nowNextRow">
        <div class="chord-block">
          <div class="chord-label">Now</div>
          <div class="chord-display idle" id="chordDisplay">Ready</div>
        </div>
        <div class="chord-arrow">&rarr;</div>
        <div class="chord-block">
          <div class="chord-label">Next</div>
          <div class="chord-display next-chord-display" id="nextChordDisplay">&ndash;</div>
        </div>
      </div>
      <div class="phase-label" id="phaseLabel"></div>
      <div class="beat-dots" id="beatDots"></div>
    </div>

    <div class="warning" id="warningMsg"></div>

    <button id="startBtn">▶ Start</button>

    <div class="panel">
      <div class="row">
        <label for="bpmRange">Tempo</label>
        <span class="bpm-value" id="bpmValue">90 BPM</span>
      </div>
      <div class="row">
        <div class="bpm-buttons">
          <button type="button" id="bpmDown">−</button>
          <button type="button" id="bpmUp">+</button>
        </div>
        <input type="range" id="bpmRange" min="30" max="240" value="90">
        <input type="number" id="bpmNumber" min="30" max="240" value="90">
      </div>
    </div>

    <div class="panel">
      <div class="row">
        <label>Practice mode</label>
        <div class="order-toggle" id="modeToggle">
          <button type="button" id="modeFree" class="active">Free</button>
          <button type="button" id="modeJustin25">Justin's 25</button>
          <button type="button" id="modeMetronome">Metronome</button>
        </div>
      </div>
      <div class="row" id="chordOrderRow">
        <label>Chord order</label>
        <div class="order-toggle">
          <button type="button" id="orderRandom" class="active">Random</button>
          <button type="button" id="orderSequential">Sequential</button>
        </div>
      </div>
      <div class="hint" id="modeHint" style="text-align:left; margin:0;">4/4 time &middot; chord changes every measure (4 beats)</div>
    </div>

    <div class="panel" id="chordsPanel">
      <div class="chord-select-row">
        <label>Chords in rotation</label>
        <button type="button" class="link-btn" id="selectAllBtn">select all / none</button>
      </div>
      <div class="chords-grid" id="chordsGrid"></div>
    </div>

    <div class="hint">Press Space to Start/Stop &middot; works offline once loaded</div>

  </div>

<script>
(function () {
  "use strict";

  const CHORDS = ["E", "Em", "D", "Dm", "A", "Am", "C", "G"];

  // JustinGuitar's "25 Most Important Changes" — the chord pairs worth
  // drilling on purpose, deliberately excluding one-finger changes like
  // A/Am, D/Dm, E/Em.
  const JUSTIN_25 = [
    ["A", "C"], ["A", "G"], ["A", "E"], ["A", "Em"], ["A", "D"], ["A", "Dm"],
    ["C", "G"], ["C", "E"], ["C", "D"], ["C", "Dm"], ["C", "Am"], ["C", "Em"],
    ["G", "E"], ["G", "D"], ["G", "Dm"], ["G", "Am"], ["G", "Em"],
    ["E", "D"], ["E", "Dm"], ["E", "Am"],
    ["D", "Am"], ["D", "Em"],
    ["Dm", "Am"], ["Dm", "Em"],
    ["Am", "Em"],
  ];

  // ---- DOM ----
  const chordDisplay = document.getElementById("chordDisplay");
  const nextChordDisplay = document.getElementById("nextChordDisplay");
  const beatDotsEl = document.getElementById("beatDots");
  const phaseLabel = document.getElementById("phaseLabel");
  const bpmRange = document.getElementById("bpmRange");
  const bpmNumber = document.getElementById("bpmNumber");
  const bpmValue = document.getElementById("bpmValue");
  const bpmUp = document.getElementById("bpmUp");
  const bpmDown = document.getElementById("bpmDown");
  const orderRandomBtn = document.getElementById("orderRandom");
  const orderSequentialBtn = document.getElementById("orderSequential");
  const modeFreeBtn = document.getElementById("modeFree");
  const modeJustin25Btn = document.getElementById("modeJustin25");
  const modeMetronomeBtn = document.getElementById("modeMetronome");
  const modeHint = document.getElementById("modeHint");
  const nowNextRow = document.getElementById("nowNextRow");
  const chordOrderRow = document.getElementById("chordOrderRow");
  const chordsPanel = document.getElementById("chordsPanel");
  const chordsGrid = document.getElementById("chordsGrid");
  const selectAllBtn = document.getElementById("selectAllBtn");
  const startBtn = document.getElementById("startBtn");
  const warningMsg = document.getElementById("warningMsg");

  // ---- State ----
  const BEATS_PER_CHORD = 4; // 4/4 time: one chord per measure
  const COUNT_IN_BEATS = 4;
  let bpm = 90;
  let orderMode = "random"; // "random" | "sequential"
  let practiceMode = "free"; // "free" | "justin25" | "metronome"
  let enabledChords = new Set(CHORDS);
  let isRunning = false;

  let audioCtx = null;
  let nextNoteTime = 0.0;
  let totalBeatCount = 0;
  let countInRemaining = 0;
  let sequentialCursor = 0;
  let lastChordName = null;
  let justin25SeqCursor = {}; // chord -> next candidate index (sequential order, justin25 mode)
  const chordSequence = []; // memoized chord per chord-group-index
  const scheduleAheadTime = 0.12; // seconds
  const lookaheadMs = 25.0;
  let timerId = null;

  const noteQueue = []; // {time, type, beatInGroup, isAccent, chordName, nextChordName}
  let rafId = null;
  let wakeLock = null;

  // ---- Wake lock (keep screen on while playing) ----
  async function acquireWakeLock() {
    if (!("wakeLock" in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
    } catch (err) {
      wakeLock = null;
    }
  }

  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release();
      wakeLock = null;
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (isRunning && document.visibilityState === "visible" && !wakeLock) {
      acquireWakeLock();
    }
  });

  // ---- Build chord checkboxes ----
  CHORDS.forEach((name) => {
    const label = document.createElement("label");
    label.className = "chord-toggle";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = true;
    input.value = name;
    input.addEventListener("change", () => {
      if (input.checked) enabledChords.add(name);
      else enabledChords.delete(name);
      updateModeHint();
      validate();
    });
    const span = document.createElement("span");
    span.textContent = name;
    label.appendChild(input);
    label.appendChild(span);
    chordsGrid.appendChild(label);
  });

  selectAllBtn.addEventListener("click", () => {
    const checkboxes = chordsGrid.querySelectorAll("input[type=checkbox]");
    const allChecked = enabledChords.size === CHORDS.length;
    checkboxes.forEach((cb) => {
      cb.checked = !allChecked;
      if (!allChecked) enabledChords.add(cb.value);
      else enabledChords.delete(cb.value);
    });
    updateModeHint();
    validate();
  });

  function eligiblePairs() {
    return JUSTIN_25.filter(([a, b]) => enabledChords.has(a) && enabledChords.has(b));
  }

  function validate() {
    if (practiceMode !== "metronome" && enabledChords.size === 0) {
      warningMsg.textContent = "Select at least one chord to start.";
      startBtn.disabled = true;
      return;
    }
    if (practiceMode === "justin25" && eligiblePairs().length === 0) {
      warningMsg.textContent = "None of Justin's 25 changes match your selected chords. Enable at least two chords that pair up in the list.";
      startBtn.disabled = true;
      return;
    }
    warningMsg.textContent = "";
    startBtn.disabled = false;
  }
  validate();

  function updateModeHint() {
    if (practiceMode === "justin25") {
      modeHint.textContent = eligiblePairs().length + " of 25 changes in rotation (filtered by chords checked below) · 4/4 time";
    } else if (practiceMode === "metronome") {
      modeHint.textContent = "Just the click, no chords or count-in · 4/4 time";
    } else {
      modeHint.textContent = "4/4 time · chord changes every measure (4 beats)";
    }
  }
  updateModeHint();

  function updateModeVisibility() {
    const isMetronome = practiceMode === "metronome";
    nowNextRow.classList.toggle("mode-hidden", isMetronome);
    chordOrderRow.classList.toggle("mode-hidden", isMetronome);
    chordsPanel.classList.toggle("mode-hidden", isMetronome);
  }
  updateModeVisibility();

  function setPracticeMode(mode) {
    practiceMode = mode;
    modeFreeBtn.classList.toggle("active", mode === "free");
    modeJustin25Btn.classList.toggle("active", mode === "justin25");
    modeMetronomeBtn.classList.toggle("active", mode === "metronome");
    updateModeHint();
    updateModeVisibility();
    validate();
  }
  modeFreeBtn.addEventListener("click", () => setPracticeMode("free"));
  modeJustin25Btn.addEventListener("click", () => setPracticeMode("justin25"));
  modeMetronomeBtn.addEventListener("click", () => setPracticeMode("metronome"));

  // ---- BPM controls ----
  function setBpm(v) {
    v = Math.max(30, Math.min(240, Math.round(v)));
    bpm = v;
    bpmRange.value = v;
    bpmNumber.value = v;
    bpmValue.textContent = v + " BPM";
  }
  bpmRange.addEventListener("input", () => setBpm(bpmRange.value));
  bpmNumber.addEventListener("input", () => {
    if (bpmNumber.value !== "") setBpm(bpmNumber.value);
  });
  bpmUp.addEventListener("click", () => setBpm(bpm + 1));
  bpmDown.addEventListener("click", () => setBpm(bpm - 1));
  setBpm(90);

  // ---- Order mode ----
  orderRandomBtn.addEventListener("click", () => {
    orderMode = "random";
    orderRandomBtn.classList.add("active");
    orderSequentialBtn.classList.remove("active");
  });
  orderSequentialBtn.addEventListener("click", () => {
    orderMode = "sequential";
    orderSequentialBtn.classList.add("active");
    orderRandomBtn.classList.remove("active");
  });

  // ---- Beat dots UI ----
  function buildBeatDots() {
    beatDotsEl.innerHTML = "";
    for (let i = 0; i < BEATS_PER_CHORD; i++) {
      const dot = document.createElement("div");
      dot.className = "beat-dot" + (i === 0 ? " accent" : "");
      beatDotsEl.appendChild(dot);
    }
  }
  buildBeatDots();

  function lightBeatDot(idx, isCountIn) {
    const dots = beatDotsEl.children;
    for (let i = 0; i < dots.length; i++) {
      const on = i === idx;
      dots[i].classList.toggle("on", on);
      dots[i].classList.toggle("countin", !!isCountIn && on);
    }
  }

  // ---- Chord sequence generation ----
  // Every transition in Justin25 mode must itself be one of the 25 curated
  // pairs — not just every other measure — so we walk the pair-graph one
  // chord at a time instead of picking independent pairs and concatenating
  // them (which let the "seam" between pairs be an arbitrary, uncurated
  // change, indistinguishable from Free mode).
  function justin25Candidates(chord) {
    const candidates = [];
    eligiblePairs().forEach(([a, b]) => {
      if (a === chord) candidates.push(b);
      else if (b === chord) candidates.push(a);
    });
    return candidates;
  }

  function pickJustin25Start() {
    const pool = eligiblePairs();
    if (pool.length === 0) return "?";
    if (orderMode === "sequential") return pool[0][0];
    const chordsInPairs = Array.from(new Set(pool.flat()));
    return chordsInPairs[Math.floor(Math.random() * chordsInPairs.length)];
  }

  function pickNextJustin25Chord(prevChord, grandparentChord) {
    const candidates = justin25Candidates(prevChord);
    if (candidates.length === 0) return prevChord === undefined ? "?" : prevChord;
    if (orderMode === "sequential") {
      const idx = (justin25SeqCursor[prevChord] || 0) % candidates.length;
      justin25SeqCursor[prevChord] = idx + 1;
      return candidates[idx];
    }
    if (candidates.length === 1) return candidates[0];
    // random, avoid immediately bouncing back to the chord before last when possible
    let choice;
    do {
      choice = candidates[Math.floor(Math.random() * candidates.length)];
    } while (choice === grandparentChord);
    return choice;
  }

  function pickChordForGroup(groupIndex) {
    if (chordSequence[groupIndex] !== undefined) return chordSequence[groupIndex];

    let choice;
    if (practiceMode === "justin25") {
      if (groupIndex === 0) {
        choice = pickJustin25Start();
      } else {
        const prev = pickChordForGroup(groupIndex - 1);
        const grandparent = groupIndex >= 2 ? pickChordForGroup(groupIndex - 2) : null;
        choice = pickNextJustin25Chord(prev, grandparent);
      }
    } else {
      const pool = Array.from(enabledChords);
      if (pool.length === 0) {
        choice = "?";
      } else if (orderMode === "sequential") {
        // Use the fixed CHORDS order, filtered to enabled ones, cycling.
        const ordered = CHORDS.filter((c) => enabledChords.has(c));
        choice = ordered[sequentialCursor % ordered.length];
        sequentialCursor++;
      } else {
        // random, avoid immediate repeat when possible
        if (pool.length === 1) {
          choice = pool[0];
        } else {
          do {
            choice = pool[Math.floor(Math.random() * pool.length)];
          } while (choice === lastChordName);
        }
      }
      lastChordName = choice;
    }
    chordSequence[groupIndex] = choice;
    return choice;
  }

  // ---- Audio ----
  function playClick(time, isAccent) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = isAccent ? 1000 : 700;
    gain.gain.setValueAtTime(0.001, time);
    gain.gain.exponentialRampToValueAtTime(isAccent ? 0.9 : 0.6, time + 0.001);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.06);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + 0.07);
  }

  function playCountInClick(time) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.value = 1200;
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(0.35, time + 0.001);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.04);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + 0.05);
  }

  function scheduler() {
    while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
      if (countInRemaining > 0) {
        const beatIndex = COUNT_IN_BEATS - countInRemaining;
        playCountInClick(nextNoteTime);
        noteQueue.push({
          time: nextNoteTime,
          type: "countin",
          beatInGroup: beatIndex,
        });
        countInRemaining--;
      } else {
        const beatInGroup = totalBeatCount % BEATS_PER_CHORD;
        const isAccent = beatInGroup === 0;

        if (practiceMode === "metronome") {
          playClick(nextNoteTime, isAccent);
          noteQueue.push({
            time: nextNoteTime,
            type: "beat",
            beatInGroup: beatInGroup,
            isAccent: isAccent,
            chordless: true,
          });
        } else {
          const groupIndex = Math.floor(totalBeatCount / BEATS_PER_CHORD);
          const chordName = pickChordForGroup(groupIndex);
          const nextChordName = pickChordForGroup(groupIndex + 1);

          playClick(nextNoteTime, isAccent);
          noteQueue.push({
            time: nextNoteTime,
            type: "beat",
            beatInGroup: beatInGroup,
            isAccent: isAccent,
            chordName: chordName,
            nextChordName: nextChordName,
          });
        }

        totalBeatCount++;
      }
      nextNoteTime += 60.0 / bpm;
    }
    timerId = setTimeout(scheduler, lookaheadMs);
  }

  function drawLoop() {
    const now = audioCtx.currentTime;
    while (noteQueue.length && noteQueue[0].time <= now) {
      const note = noteQueue.shift();
      if (note.type === "countin") {
        phaseLabel.textContent = "Count-in – " + (COUNT_IN_BEATS - note.beatInGroup);
        lightBeatDot(note.beatInGroup, true);
      } else if (note.chordless) {
        phaseLabel.textContent = "";
        lightBeatDot(note.beatInGroup, false);
      } else {
        phaseLabel.textContent = "";
        chordDisplay.classList.remove("pending");
        if (note.chordName !== chordDisplay.textContent || chordDisplay.classList.contains("idle")) {
          chordDisplay.textContent = note.chordName;
          chordDisplay.classList.remove("idle");
        }
        nextChordDisplay.textContent = note.nextChordName;
        lightBeatDot(note.beatInGroup, false);
        chordDisplay.classList.remove("pulse");
        // force reflow to restart animation
        void chordDisplay.offsetWidth;
        chordDisplay.classList.add("pulse");
      }
    }
    if (isRunning) rafId = requestAnimationFrame(drawLoop);
  }

  function start() {
    if (practiceMode !== "metronome" && enabledChords.size === 0) return;
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
    isRunning = true;
    totalBeatCount = 0;
    countInRemaining = practiceMode === "metronome" ? 0 : COUNT_IN_BEATS;
    sequentialCursor = 0;
    lastChordName = null;
    justin25SeqCursor = {};
    chordSequence.length = 0;
    noteQueue.length = 0;
    nextNoteTime = audioCtx.currentTime + 0.05;
    startBtn.textContent = "■ Stop";
    startBtn.classList.add("running");

    if (practiceMode === "metronome") {
      phaseLabel.textContent = "";
    } else {
      // Show the first chord right away so it can be prepared during the count-in.
      const firstChord = pickChordForGroup(0);
      const secondChord = pickChordForGroup(1);
      chordDisplay.textContent = firstChord;
      chordDisplay.classList.remove("idle");
      chordDisplay.classList.add("pending");
      nextChordDisplay.textContent = secondChord;
      phaseLabel.textContent = "Count-in – " + COUNT_IN_BEATS;
    }

    scheduler();
    drawLoop();
    acquireWakeLock();
  }

  function stop() {
    isRunning = false;
    clearTimeout(timerId);
    cancelAnimationFrame(rafId);
    releaseWakeLock();
    startBtn.textContent = "▶ Start";
    startBtn.classList.remove("running");
    chordDisplay.textContent = "Ready";
    chordDisplay.classList.remove("pending");
    chordDisplay.classList.add("idle");
    nextChordDisplay.textContent = "–";
    phaseLabel.textContent = "";
    lightBeatDot(-1, false);
  }

  startBtn.addEventListener("click", () => {
    if (isRunning) stop();
    else start();
  });

  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && e.target === document.body) {
      e.preventDefault();
      if (startBtn.disabled) return;
      if (isRunning) stop();
      else start();
    }
  });
})();
</script>

</body>
</html>
